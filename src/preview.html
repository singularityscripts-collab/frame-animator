<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:" />
    <title>Testar cena</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111114;
        color: #9a9aa6;
        font: 12px 'Segoe UI', system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: calc(100% - 28px);
      }
      footer button {
        background: #2e2e34;
        color: #ddd;
        border: 1px solid #44444c;
        border-radius: 4px;
        padding: 1px 8px;
        font: inherit;
        cursor: pointer;
      }
      #log {
        color: #ffd60a;
        max-width: 50%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      body {
        position: relative;
      }
      footer {
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <canvas id="player"></canvas>
    <footer><span id="info">Carregando…</span><button id="pause">Pausar</button><span id="log"></span></footer>
    <script type="module" src="preview.js"></script>
  </body>
</html>
